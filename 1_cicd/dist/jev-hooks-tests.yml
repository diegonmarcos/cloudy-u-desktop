      - ".github/workflows/jev-hooks-tests.yml"
  workflow_dispatch:

concurrency:
  group: jev-hooks-tests
  cancel-in-progress: true

jobs:
  jev-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
